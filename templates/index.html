{% extends "base.html" %}

{% block title %}Accueil{% endblock %}

{% block content %}

<h2>Liste des éléments</h2>

<p>
    Cette page présente les informations disponibles
    dans l'application.
</p>

<div class="liste">

    {% for element in donnees %}

    <article class="carte">

        <h3>{{ element.id }}</h3>

        <p>{{ element.numeroTicket }}</p>

        <a href="{{ url_for('detail', id=element.id) }}">
            Voir le détail
        </a>

    </article>

    {% endfor %}

</div>

{% endblock %}
